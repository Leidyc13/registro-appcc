<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro APPCC</title>
<meta name="description" content="Registro digital APPCC para obradores: temperaturas, limpieza, recepción con alérgenos, lotes, trazabilidad e incidencias.">
<meta name="theme-color" content="#0b6b63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface-2:#f6f9f8; --ink:#142120; --muted:#566866; --line:#d5e0de;
  --accent:#0b6b63; --accent-ink:#ffffff; --accent-soft:#dcefec;
  --ok:#1d7a3e; --ok-bg:#e1f3e7; --warn:#9a5b00; --warn-bg:#fdf0d8; --crit:#b42318; --crit-bg:#fde4e1;
  --band:#cfe8e4;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1514; --surface:#15201f; --surface-2:#1a2726; --ink:#e3ecea; --muted:#94a6a3; --line:#28403d;
  --accent:#4fbfb2; --accent-ink:#05201d; --accent-soft:#163a36;
  --ok:#62cf8f; --ok-bg:#15301f; --warn:#f2b552; --warn-bg:#352812; --crit:#ff8b7c; --crit-bg:#3a1a17;
  --band:#1d3e3a; color-scheme:dark;}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:12px 6px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.who select{width:auto;padding:4px 8px;font-size:.85rem}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:10px 11px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--crit);color:var(--surface);font:600 .72rem/18px var(--f-mono);text-align:center}
main{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.1rem;font-weight:700}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h2{margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--accent)}
.stat .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font:700 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat.crit{border-left:4px solid var(--crit)} .stat.warn{border-left:4px solid var(--warn)} .stat.ok{border-left:4px solid var(--ok)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--line)}
.todo li.crit{border-left-color:var(--crit)} .todo li.warn{border-left-color:var(--warn)} .todo li.ok{border-left-color:var(--ok)}
.todo li div{flex:1;min-width:0}
.todo small{display:block;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono,td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86rem}
form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 .92rem var(--f-body);padding:9px 16px;border-radius:6px;cursor:pointer;align-self:flex-start}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:600 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.lot{font-family:var(--f-mono);font-weight:400}
.note{padding:10px 12px;border-radius:8px;font-size:.9rem;margin:0}
.note.crit{background:var(--crit-bg);color:var(--crit)} .note.warn{background:var(--warn-bg);color:var(--warn)} .note.ok{background:var(--ok-bg);color:var(--ok)} .note.info{background:var(--accent-soft);color:var(--ink)}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.check:last-child{border-bottom:0}
.check div{flex:1;min-width:180px}
.check small{color:var(--muted);display:block}
.spark{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.spark figure{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.spark figcaption{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600}
.spark figcaption span{white-space:nowrap;color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:.78rem}
.spark svg{width:100%;height:auto;display:block;margin-top:6px}
.tree{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tree .node{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.tree .arrow{color:var(--muted);font-size:.85rem;padding-left:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
.muted{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.auth{max-width:420px;margin:8vh auto 40px;display:flex;flex-direction:column;gap:16px}
.auth .brandbig{font:800 1.8rem var(--f-display);letter-spacing:-.02em}
.code{font:600 1.4rem var(--f-mono);letter-spacing:.12em;padding:8px 14px;border:1px dashed var(--accent);border-radius:8px;display:inline-block;background:var(--accent-soft)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.editrow{display:grid;grid-template-columns:minmax(0,2fr) 80px 80px auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.editrow.t{grid-template-columns:minmax(0,1fr) minmax(0,2fr) 110px auto}
.editrow>.btn{align-self:end}
@media (max-width:600px){.editrow,.editrow.t{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ================= utilidades ================= */
const CFG = window.APPCC_CONFIG || {};
const ALERG=['Gluten','Crustáceos','Huevo','Pescado','Cacahuete','Soja','Leche','Frutos de cáscara','Apio','Mostaza','Sésamo','Sulfitos','Altramuces','Moluscos'];
const TURNOS=['09:00','17:00'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day=o=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return isoLocal(d)};
const today=()=>day(0);
const fmt=s=>{if(!s)return '—';const[y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y.slice(2)};
const hm=t=>String(t||'').slice(0,5);
const daysTo=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const num=v=>v===null||v===undefined?null:Number(v);
const fmtNum=v=>String(v).replace('.',',');
const inRange=(e,v)=>v>=num(e.min)&&v<=num(e.max);
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?5000:2600)}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login credentials/i.test(m))return 'Email o contraseña incorrectos.';
  if(/Email not confirmed/i.test(m))return 'Falta confirmar el email. Revisa tu correo (y la carpeta de spam).';
  if(/User already registered/i.test(m))return 'Ya existe una cuenta con ese email. Inicia sesión.';
  if(/Password should be at least/i.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sin conexión. Comprueba internet y vuelve a intentarlo.';
  if(/duplicate key.*lote/i.test(m))return 'Ya existe un lote con ese código.';
  return m}

/* ================= capa de datos ================= */
let sb=null;
const api={
  async session(){const {data}=await sb.auth.getSession();return data.session},
  async login(email,pw){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error},
  async signup(email,pw){const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;return data},
  async reset(email){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error},
  async newPassword(pw){const {error}=await sb.auth.updateUser({password:pw});if(error)throw error},
  async logout(){await sb.auth.signOut()},
  async rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data},
  async memberships(uid){const {data,error}=await sb.from('miembros').select('rol,nombre,iniciales,obrador_id,obradores(id,nombre,sin_gluten,codigo_invitacion)').eq('user_id',uid);if(error)throw error;return data},
  async list(t,o,opt={}){let q=sb.from(t).select(opt.cols||'*').eq('obrador_id',o);if(opt.since)q=q.gte(opt.since[0],opt.since[1]);if(opt.order)q=q.order(opt.order,{ascending:!!opt.asc});q=q.limit(opt.limit||2000);const {data,error}=await q;if(error)throw error;return data},
  async insert(t,row){const {data,error}=await sb.from(t).insert(row).select().single();if(error)throw error;return data},
  async update(t,id,patch){const {error}=await sb.from(t).update(patch).eq('id',id);if(error)throw error},
  async updateObrador(id,patch){const {error}=await sb.from('obradores').update(patch).eq('id',id);if(error)throw error},
  async removeMember(o,uid){const {error}=await sb.from('miembros').delete().eq('obrador_id',o).eq('user_id',uid);if(error)throw error},
};

/* ================= estado ================= */
const S={user:null,members:[],cur:null,me:null,data:null,view:'hoy',trazQ:'',recovery:false};
function curObrador(){return S.cur&&S.cur.obradores}
function isAdmin(){return S.me&&S.me.rol==='admin'}

async function loadData(){
  const o=S.cur.obrador_id;
  const [equipos,tareas,temps,limp,rec,lotes,ings,inc,miembros]=await Promise.all([
    api.list('equipos',o,{order:'orden',asc:true}),
    api.list('tareas_limpieza',o,{order:'orden',asc:true}),
    api.list('registros_temp',o,{since:['fecha',day(-60)],order:'created_at'}),
    api.list('registros_limpieza',o,{since:['fecha',day(-60)],order:'created_at'}),
    api.list('recepciones',o,{since:['fecha',day(-400)],order:'fecha'}),
    api.list('lotes_produccion',o,{since:['fecha',day(-400)],order:'fecha'}),
    api.list('lote_ingredientes',o,{cols:'lote_id,recepcion_id'}),
    api.list('incidencias',o,{order:'created_at'}),
    api.list('miembros',o,{cols:'user_id,rol,nombre,iniciales,created_at'}),
  ]);
  S.data={equipos,tareas,temps,limp,rec,lotes,ings,inc,miembros};
}
async function refresh(){try{await loadData();render()}catch(e){toast(errMsg(e),true)}}
async function busy(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(errMsg(e),true)}finally{if(btn)btn.disabled=false}}

/* ================= arranque ================= */
async function boot(){
  const isRecovery=/type=recovery/.test(location.hash);
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){$('#app').innerHTML=`<main class="wrap"><div class="auth"><div class="brandbig">Registro APPCC</div><p class="note warn">Falta configurar la conexión. Rellena <b>config.js</b> con la URL y la clave pública (anon) de tu proyecto de Supabase.</p></div></main>`;return}
  if(!window.supabase){$('#app').innerHTML=`<main class="wrap"><div class="auth"><p class="note crit">No se ha podido cargar la aplicación. Comprueba tu conexión y recarga la página.</p></div></main>`;return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){S.recovery=true;renderAuth('nueva');return}
    if(ev==='SIGNED_OUT'){S.user=null;S.cur=null;S.data=null;renderAuth('login')}
  });
  if(isRecovery){S.recovery=true;renderAuth('nueva');return}
  const s=await api.session();
  if(!s){renderAuth('login');return}
  await afterLogin(s.user);
}
async function afterLogin(user){
  S.user=user;
  try{S.members=await api.memberships(user.id)}catch(e){$('#app').innerHTML=`<main class="wrap"><div class="auth"><p class="note crit">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Reintentar</button></div></main>`;return}
  if(!S.members.length){renderOnboarding();return}
  const saved=store.get('appcc-obrador');
  S.cur=S.members.find(m=>m.obrador_id===saved)||S.members[0];S.me=S.cur;
  $('#app').innerHTML='<div class="loading">Cargando registros…</div>';
  await refresh();
}
window.addEventListener('focus',()=>{if(S.data&&document.visibilityState==='visible'&&!document.querySelector('form :focus'))refresh()});

/* ================= pantallas de acceso ================= */
function shell(inner){$('#app').innerHTML=`<main class="wrap"><div class="auth"><div><div class="brandbig">${esc(CFG.nombreServicio||'Registro APPCC')}</div><p class="lede">Registro digital de APPCC para obradores y pymes alimentarias.</p></div>${inner}</div></main>`}
function renderAuth(mode){
  const forms={
    login:`<section class="panel"><h2>Iniciar sesión</h2><form id="fA"><label for="aE">Email<input id="aE" type="email" autocomplete="email" required></label><label for="aP">Contraseña<input id="aP" type="password" autocomplete="current-password" required></label><button class="btn">Entrar</button></form></section>
      <p class="muted">¿No tienes cuenta? <button class="link" data-m="registro">Crear cuenta</button> · <button class="link" data-m="olvido">He olvidado la contraseña</button></p>`,
    registro:`<section class="panel"><h2>Crear cuenta</h2><form id="fA"><label for="aE">Email<input id="aE" type="email" autocomplete="email" required></label><label for="aP">Contraseña (mínimo 8 caracteres)<input id="aP" type="password" minlength="8" autocomplete="new-password" required></label><label class="inline" for="aL"><input id="aL" type="checkbox" required> Acepto que mis datos se usen para prestar este servicio de registro APPCC.</label><button class="btn">Crear cuenta</button></form></section>
      <p class="muted">¿Ya tienes cuenta? <button class="link" data-m="login">Iniciar sesión</button></p>`,
    olvido:`<section class="panel"><h2>Recuperar contraseña</h2><form id="fA"><label for="aE">Email de tu cuenta<input id="aE" type="email" autocomplete="email" required></label><button class="btn">Enviar enlace</button></form></section>
      <p class="muted"><button class="link" data-m="login">Volver a iniciar sesión</button></p>`,
    nueva:`<section class="panel"><h2>Nueva contraseña</h2><form id="fA"><label for="aP">Nueva contraseña (mínimo 8 caracteres)<input id="aP" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn">Guardar contraseña</button></form></section>`,
    revisa:`<p class="note ok">Te hemos enviado un email. Abre el enlace para confirmar tu cuenta y vuelve aquí para iniciar sesión.</p><p class="muted"><button class="link" data-m="login">Iniciar sesión</button></p>`
  };
  shell(forms[mode]);
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  const f=$('#fA');if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const b=f.querySelector('.btn');busy(b,async()=>{
    const email=$('#aE')?.value.trim(),pw=$('#aP')?.value;
    if(mode==='login'){await api.login(email,pw);const s=await api.session();await afterLogin(s.user)}
    if(mode==='registro'){const d=await api.signup(email,pw);if(d.session)await afterLogin(d.session.user);else renderAuth('revisa')}
    if(mode==='olvido'){await api.reset(email);shell('<p class="note ok">Si existe una cuenta con ese email, te llegará un enlace para crear una contraseña nueva.</p><p class="muted"><button class="link" data-m="login">Volver</button></p>');document.querySelector('[data-m]').onclick=()=>renderAuth('login')}
    if(mode==='nueva'){await api.newPassword(pw);S.recovery=false;history.replaceState(null,'',location.pathname);toast('Contraseña guardada');const s=await api.session();await afterLogin(s.user)}
  })};
}
function renderOnboarding(){
  shell(`<p class="note info">Has iniciado sesión como <b>${esc(S.user.email)}</b>. Ahora crea tu obrador o únete al de tu empresa.</p>
  <section class="panel"><h2>Soy el responsable: crear mi obrador</h2><form id="fC">
    <label for="cN">Nombre del obrador o empresa<input id="cN" required></label>
    <div class="row"><label for="cP">Tu nombre<input id="cP" required autocomplete="name"></label><label for="cI">Tus iniciales<input id="cI" required maxlength="4" class="mono" style="text-transform:uppercase"></label></div>
    <label class="inline" for="cG"><input id="cG" type="checkbox"> Es un obrador sin gluten (avisar si entra algo con gluten)</label>

const eqById=id=>S.data.equipos.find(e=>e.id===id);
const recById=id=>S.data.rec.find(r=>r.id===id);
const ingsOf=loteId=>S.data.ings.filter(i=>i.lote_id===loteId).map(i=>i.recepcion_id);
function lastDone(tareaId){let last=null;for(const r of S.data.limp)if(r.tarea_id===tareaId&&(!last||r.fecha>last))last=r.fecha;return last}
function cleaningToday(){
  const T=today();const doneToday=S.data.limp.filter(r=>r.fecha===T);
  return S.data.tareas.filter(t=>t.activo).map(t=>{const d=doneToday.find(r=>r.tarea_id===t.id);const last=lastDone(t.id);
    const due=t.frecuencia==='diaria'||!last||daysTo(last)<=-7||(d&&true);return {...t,done:d||null,last,due}}).filter(t=>t.due);
}
function status(){
  const T=today();const now=nowHM();const eqs=S.data.equipos.filter(e=>e.activo);
  const hoy=S.data.temps.filter(t=>t.fecha===T);
  const pend=[];for(const h of TURNOS)for(const e of eqs){if(h>now)continue;const hechos=hoy.filter(t=>t.equipo_id===e.id).length;const idx=TURNOS.indexOf(h);if(hechos<=idx)pend.push({e,h})}
  const fuera=hoy.filter(t=>{const e=eqById(t.equipo_id);return e&&!inRange(e,num(t.valor))});
  const limp=cleaningToday();const limpPend=limp.filter(t=>!t.done);
  const cad=S.data.rec.filter(r=>r.estado==='aceptado'&&daysTo(r.caducidad)<=5&&daysTo(r.caducidad)>=-3);
  const inc=S.data.inc.filter(i=>i.estado==='abierta');
  return {hoy,pend,fuera,limp,limpPend,cad,inc,esperadas:eqs.length*TURNOS.filter(h=>h<=now).length};
}

function sparkSVG(e){
  const pts=S.data.temps.filter(t=>t.equipo_id===e.id).slice(-14);
  const W=260,H=80,pl=30,pr=8,pt=8,pb=16;const mn=num(e.min),mx=num(e.max);
  const vals=pts.map(p=>num(p.valor)).concat([mn,mx]);const lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;
  const x=i=>pl+(pts.length<2?0:i*(W-pl-pr)/(pts.length-1));const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(num(p.valor)).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>{const bad=!inRange(e,num(p.valor));return (bad||i===pts.length-1)?`<circle cx="${x(i).toFixed(1)}" cy="${y(num(p.valor)).toFixed(1)}" r="${bad?4:3}" fill="${bad?'var(--crit)':'var(--accent)'}"/>`:''}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Últimas lecturas de ${esc(e.nombre)}"><rect x="${pl}" y="${y(mx).toFixed(1)}" width="${W-pl-pr}" height="${(y(mn)-y(mx)).toFixed(1)}" fill="var(--band)"/>
   <text x="${pl-4}" y="${(y(mx)+4).toFixed(1)}" text-anchor="end" font-size="10" font-family="monospace" fill="var(--muted)">${fmtNum(mx)}</text><text x="${pl-4}" y="${(y(mn)+4).toFixed(1)}" text-anchor="end" font-size="10" font-family="monospace" fill="var(--muted)">${fmtNum(mn)}</text>
   ${pts.length?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}`:`<text x="${pl+8}" y="${H/2}" font-size="11" fill="var(--muted)">Sin lecturas todavía</text>`}
   <text x="${pl}" y="${H-3}" font-size="10" font-family="monospace" fill="var(--muted)">últimas 14 lecturas</text></svg>`;
}

},
inf(){
  return `<div><h1>Informes para inspección</h1><p class="lede">Elige registro y fechas. Copia el CSV y pégalo en Excel, o descárgalo.</p></div>

  <textarea id="xOut" class="mono" style="min-height:280px;margin-top:12px;font-size:.8rem" readonly aria-label="CSV del registro"></textarea></section>`;
},

function trazResult(q){
  q=(q||'').trim().toUpperCase();if(!q)return '<p class="muted">Escribe un lote o pulsa uno de los recientes.</p>';
  const p=S.data.lotes.find(x=>x.lote.toUpperCase()===q);const rs=S.data.rec.filter(x=>x.lote.toUpperCase()===q);
  let out='';
  if(p){out+=`<h2>Hacia atrás: de qué está hecho ${esc(p.lote)}</h2><div class="tree"><div class="node"><b>${esc(p.producto)}</b> <span class="mono">${esc(p.lote)}</span><br><small class="muted">Elaborado ${fmt(p.fecha)} · ${esc(p.cantidad)} · Alérgenos: ${p.alergenos.length?esc(p.alergenos.join(', ')):'ninguno'}</small></div><div class="arrow">elaborado con</div>${ingsOf(p.id).map(id=>{const x=recById(id);return x?`<div class="node"><b>${esc(x.producto)}</b> <button class="chip lot" data-traz="${esc(x.lote)}">${esc(x.lote)}</button><br><small class="muted">${esc(x.proveedor)} · recibido ${fmt(x.fecha)} · cad. ${fmt(x.caducidad)}${x.alergenos.length?' · '+esc(x.alergenos.join(', ')):''}</small></div>`:'<div class="node muted">Ingrediente fuera del periodo cargado</div>'}).join('')}</div>`}
  rs.forEach(r=>{const us=S.data.lotes.filter(x=>ingsOf(x.id).includes(r.id));out+=`<h2 style="margin-top:${out?'18px':'0'}">Hacia delante: dónde se usó ${esc(r.lote)}</h2><div class="tree"><div class="node"><b>${esc(r.producto)}</b> <span class="mono">${esc(r.lote)}</span><br><small class="muted">${esc(r.proveedor)} · recibido ${fmt(r.fecha)} · ${r.estado}</small></div><div class="arrow">${us.length?'usado en '+us.length+' lote'+(us.length>1?'s':''):'no se ha usado en ningún lote'}</div>${us.map(x=>`<div class="node"><b>${esc(x.producto)}</b> <button class="chip lot" data-traz="${esc(x.lote)}">${esc(x.lote)}</button><br><small class="muted">Elaborado ${fmt(x.fecha)} · ${esc(x.cantidad)}</small></div>`).join('')}${us.length?'<p class="note warn">Ante una alerta del proveedor sobre este lote, estos son los lotes a inmovilizar o retirar.</p>':''}</div>`});
  return out||`<p class="note warn">No hay ningún lote ${esc(q)} registrado en los últimos 13 meses.</p>`;
}

function csv(k,d1,d2){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const line=a=>a.map(q).join(';');const inR=f=>f>=d1&&f<=d2;
  if(k==='temp')return [line(['Fecha','Hora','Equipo','Temperatura °C','Mín','Máx','Estado','Acción correctiva','Responsable'])].concat(S.data.temps.filter(t=>inR(t.fecha)).map(t=>{const e=eqById(t.equipo_id)||{nombre:'?',min:'',max:''};return line([fmt(t.fecha),hm(t.hora),e.nombre,fmtNum(t.valor),fmtNum(e.min),fmtNum(e.max),inRange(e,num(t.valor))?'Correcta':'Fuera de rango',t.accion,t.iniciales])})).join('\n');
  if(k==='limp')return [line(['Fecha','Hora','Zona','Tarea','Frecuencia','Responsable'])].concat(S.data.limp.filter(r=>inR(r.fecha)).map(r=>{const t=S.data.tareas.find(x=>x.id===r.tarea_id)||{};return line([fmt(r.fecha),hm(r.hora),t.zona,t.tarea,t.frecuencia,r.iniciales])})).join('\n');
  if(k==='rec')return [line(['Fecha','Proveedor','Producto','Lote','Caducidad','Temp. llegada','Alérgenos','Estado','Observaciones','Responsable'])].concat(S.data.rec.filter(r=>inR(r.fecha)).map(r=>line([fmt(r.fecha),r.proveedor,r.producto,r.lote,fmt(r.caducidad),r.temperatura===null?'ambiente':fmtNum(r.temperatura),r.alergenos.join(', '),r.estado,r.observaciones,r.iniciales]))).join('\n');
  if(k==='prod')return [line(['Fecha','Lote','Producto','Cantidad','Lotes de materia prima','Alérgenos','Responsable'])].concat(S.data.lotes.filter(p=>inR(p.fecha)).map(p=>line([fmt(p.fecha),p.lote,p.producto,p.cantidad,ingsOf(p.id).map(id=>recById(id)?.lote||'?').join(', '),p.alergenos.join(', '),p.iniciales]))).join('\n');
  return [line(['Fecha','Tipo','Descripción','Acción correctiva','Estado','Abierta por','Cerrada por','Fecha cierre'])].concat(S.data.inc.filter(i=>inR(i.fecha)).map(i=>line([fmt(i.fecha),i.tipo,i.descripcion,i.accion,i.estado,i.iniciales,i.cerrada_por||'',i.cerrada_at?fmt(String(i.cerrada_at).slice(0,10)):'']))).join('\n');
}

/* ================= acciones por vista ================= */
const o_=()=>S.cur.obrador_id;
const A={
temp(){
  const f=$('#fT');if(!f)return;
  const chk=()=>{const e=eqById($('#tEq').value);const v=parseFloat($('#tV').value);const bad=!isNaN(v)&&!inRange(e,v);$('#tWarn').hidden=!bad;$('#tAccL').hidden=!bad;if(bad)$('#tWarn').textContent=`${fmtNum(v)} °C está fuera del rango de ${e.nombre} (${fmtNum(e.min)} a ${fmtNum(e.max)} °C). Registra qué se ha hecho.`};
  $('#tEq').onchange=chk;$('#tV').oninput=chk;
  f.onsubmit=ev=>{ev.preventDefault();const e=eqById($('#tEq').value);const v=parseFloat($('#tV').value);const bad=!inRange(e,v);const acc=$('#tAcc').value.trim();
    if(bad&&!acc){$('#tAcc').focus();toast('Falta la acción correctiva',true);return}
    busy(ev.submitter,async()=>{const hora=$('#tH').value;
      await api.insert('registros_temp',{obrador_id:o_(),equipo_id:e.id,valor:v,fecha:today(),hora,accion:bad?acc:'',iniciales:ini()});
      if(bad)await api.insert('incidencias',{obrador_id:o_(),fecha:today(),tipo:'Temperatura',descripcion:`${e.nombre} a ${fmtNum(v)} °C a las ${hora} (límite ${fmtNum(e.min)} a ${fmtNum(e.max)} °C).`,accion:acc,iniciales:ini()});
      await refresh();toast(bad?'Lectura guardada. Incidencia abierta.':'Lectura guardada')})};
},
limp(){document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>busy(b,async()=>{await api.insert('registros_limpieza',{obrador_id:o_(),tarea_id:b.dataset.done,fecha:today(),hora:nowHM(),iniciales:ini()});await refresh();toast('Tarea marcada como hecha')}))},
rec(){
  const sel=new Set();const sg=curObrador().sin_gluten;
  const warn=()=>{const m=[];if(sg&&sel.has('Gluten'))m.push('Contiene gluten: en un obrador sin gluten debe rechazarse.');const t=parseFloat($('#rTemp').value);if(!isNaN(t)&&t>4)m.push(`Llega a ${fmtNum(t)} °C. Un producto refrigerado debe llegar a 4 °C o menos.`);
    if($('#rCad').value&&daysTo($('#rCad').value)<0)m.push('La fecha de caducidad ya ha pasado.');$('#rWarn').hidden=!m.length;$('#rWarn').innerHTML=m.map(esc).join('<br>')};
  $('#rAl').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const a=b.dataset.a;sel.has(a)?sel.delete(a):sel.add(a);b.setAttribute('aria-pressed',sel.has(a));warn()};
  $('#rTemp').oninput=warn;$('#rCad').onchange=warn;
  $('#fR').onsubmit=e=>{e.preventDefault();const estado=(e.submitter&&e.submitter.dataset.estado)||'aceptado';const t=$('#rTemp').value;
    busy(e.submitter,async()=>{const r={obrador_id:o_(),fecha:today(),proveedor:$('#rProv').value.trim(),producto:$('#rProd').value.trim(),lote:$('#rLote').value.trim().toUpperCase(),caducidad:$('#rCad').value,temperatura:t===''?null:parseFloat(t),alergenos:ALERG.filter(a=>sel.has(a)),estado,observaciones:$('#rObs').value.trim(),iniciales:ini()};
      await api.insert('recepciones',r);
      if(estado==='rechazado')await api.insert('incidencias',{obrador_id:o_(),fecha:today(),tipo:'Recepción',descripcion:`Rechazado ${r.producto} (lote ${r.lote}) de ${r.proveedor}.`,accion:r.observaciones||'Mercancía devuelta al proveedor.',iniciales:ini()});
      await refresh();toast(estado==='aceptado'?'Recepción registrada':'Rechazo registrado. Incidencia abierta.')})};
},
prod(){
  const sel=new Set();
  const upd=()=>{const s=new Set();sel.forEach(id=>recById(id).alergenos.forEach(a=>s.add(a)));const al=ALERG.filter(a=>s.has(a));const n=$('#pAl');const sg=curObrador().sin_gluten;
    if(!sel.size){n.className='note ok';n.textContent='Selecciona ingredientes para ver los alérgenos del lote.';return}
    n.className='note '+(sg&&al.includes('Gluten')?'crit':al.length?'warn':'ok');n.textContent=al.length?'Alérgenos a declarar en la etiqueta: '+al.join(', ')+(sg&&al.includes('Gluten')?'. Atención: no se puede etiquetar como sin gluten.':''):'Sin alérgenos de declaración obligatoria.'};
  $('#pIng').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const id=b.dataset.r;sel.has(id)?sel.delete(id):sel.add(id);b.setAttribute('aria-pressed',sel.has(id));upd()};
  $('#fP').onsubmit=e=>{e.preventDefault();if(!sel.size){toast('Marca al menos un lote de materia prima',true);return}
    busy(e.submitter,async()=>{const lote=await api.rpc('crear_lote',{p_obrador:o_(),p_producto:$('#pProd').value,p_cantidad:$('#pCant').value,p_prefijo:$('#pPre').value,p_ingredientes:[...sel],p_iniciales:ini()});await refresh();toast('Lote '+lote+' creado')})};
},
traz(){$('#fZ').onsubmit=e=>{e.preventDefault();S.trazQ=$('#zQ').value;$('#zOut').innerHTML=trazResult(S.trazQ)}},
inc(){
  $('#fI').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await api.insert('incidencias',{obrador_id:o_(),fecha:today(),tipo:$('#iTipo').value,descripcion:$('#iDesc').value.trim(),accion:$('#iAcc').value.trim(),iniciales:ini()});await refresh();toast('Incidencia registrada')})};
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>busy(b,async()=>{await api.rpc('cerrar_incidencia',{p_id:b.dataset.close,p_iniciales:ini()});await refresh();toast('Incidencia cerrada')}));
},
inf(){
  const fill=()=>$('#xOut').value=csv($('#xR').value,$('#xD').value||'0000',$('#xH').value||'9999');fill();['xR','xD','xH'].forEach(id=>$('#'+id).onchange=fill);
  $('#xCopy').onclick=()=>{const t=$('#xOut').value;const fb=()=>{$('#xOut').select();toast('Selecciona y copia el texto (Ctrl+C)')};try{navigator.clipboard.writeText(t).then(()=>toast('CSV copiado'),fb)}catch(e){fb()}};
  $('#xDl').onclick=()=>{const blob=new Blob(['﻿'+$('#xOut').value],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`APPCC_${$('#xR').value}_${$('#xD').value}_${$('#xH').value}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
},
aj(){
  $('#out').onclick=()=>api.logout();
  $('#fMe').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await api.rpc('actualizar_perfil',{p_obrador:o_(),p_nombre:$('#meN').value,p_iniciales:$('#meI').value});S.members=await api.memberships(S.user.id);S.cur=S.members.find(m=>m.obrador_id===o_());S.me=S.cur;await refresh();toast('Datos guardados')})};
  if(!isAdmin())return;
  $('#fO').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await api.updateObrador(o_(),{nombre:$('#oN').value.trim(),sin_gluten:$('#oG').checked});S.members=await api.memberships(S.user.id);S.cur=S.members.find(m=>m.obrador_id===o_());S.me=S.cur;render();toast('Obrador guardado')})};
  $('#cpCode').onclick=()=>{const c=$('#code').textContent;try{navigator.clipboard.writeText(c).then(()=>toast('Código copiado'),()=>toast('Código: '+c))}catch(e){toast('Código: '+c)}};
  $('#newCode').onclick=e=>busy(e.target,async()=>{const c=await api.rpc('nuevo_codigo',{p_obrador:o_()});S.cur.obradores.codigo_invitacion=c;render();toast('Código cambiado. El anterior ya no sirve.')});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const id=b.dataset.rm;const box=$('#rm-'+id);box.innerHTML='<span>¿Seguro?</span> <button class="btn danger sm" type="button" data-y>Sí, quitar</button> <button class="btn ghost sm" type="button" data-n>No</button>';
    box.querySelector('[data-n]').onclick=render;box.querySelector('[data-y]').onclick=ev=>busy(ev.target,async()=>{await api.removeMember(o_(),id);await refresh();toast('Acceso retirado')})});
  document.querySelectorAll('[data-eq]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const mn=parseFloat(f.mn.value),mx=parseFloat(f.mx.value);if(mx<mn){toast('El máximo no puede ser menor que el mínimo',true);return}
    busy(e.submitter,async()=>{await api.update('equipos',f.dataset.eq,{nombre:f.n.value.trim(),min:mn,max:mx,activo:f.ac.checked});await refresh();toast('Equipo guardado')})});
  $('#fEqN').onsubmit=e=>{e.preventDefault();const f=e.target;const mn=parseFloat(f.mn.value),mx=parseFloat(f.mx.value);if(mx<mn){toast('El máximo no puede ser menor que el mínimo',true);return}
    busy(e.submitter,async()=>{await api.insert('equipos',{obrador_id:o_(),nombre:f.n.value.trim(),min:mn,max:mx,orden:S.data.equipos.length+1});await refresh();toast('Equipo añadido')})};
  document.querySelectorAll('[data-ta]').forEach(f=>f.onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await api.update('tareas_limpieza',f.dataset.ta,{zona:f.z.value.trim(),tarea:f.t.value.trim(),frecuencia:f.f.value,activo:f.ac.checked});await refresh();toast('Tarea guardada')})});
  $('#fTaN').onsubmit=e=>{e.preventDefault();const f=e.target;busy(e.submitter,async()=>{await api.insert('tareas_limpieza',{obrador_id:o_(),zona:f.z.value.trim(),tarea:f.t.value.trim(),frecuencia:f.f.value,orden:S.data.tareas.length+1});await refresh();toast('Tarea añadida')})};
}};

boot().catch(e=>{$('#app').innerHTML=`<main class="wrap"><div class="auth"><p class="note crit">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Reintentar</button></div></main>`});
